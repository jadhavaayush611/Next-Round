services:
  db:
    image: postgres:17-alpine
    container_name: nextround-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nextround_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nextround_password}
      POSTGRES_DB: ${POSTGRES_DB:-nextround_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-nextround_user} -d $${POSTGRES_DB:-nextround_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nextround-backend
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-nextround_user}:${POSTGRES_PASSWORD:-nextround_password}@db:5432/${POSTGRES_DB:-nextround_db}
      - JWT_SECRET=${JWT_SECRET:-change_me_in_production_jwt_secret_key_12345}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      - ENVIRONMENT=development
      - STORAGE_LOCAL_ROOT=/app/uploads
    volumes:
      - ./backend:/app
      - resume_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nextround-frontend
    restart: unless-stopped
    command: npm run dev
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
  resume_uploads:
    driver: local
